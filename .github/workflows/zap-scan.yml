name: owasp-scan

on:
  push:
    branches: [githubcicd]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Prepare scan script
        run: |
          sed -i 's/\r$//' scripts/zap-script.sh
          chmod +x scripts/zap-script.sh

      - name: ZAP scan
        run: scripts/zap-script.sh

      - name: Archive ZAP report
        uses: actions/upload-artifact@v4
        with:
          name: zap report
          path: zap_baseline_report.html
          if-no-files-found: error